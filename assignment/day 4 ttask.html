task :2

const createStock = () => {
    let stock = 10;

    const addStock = (newStock) => {
        stock += newStock;
    };

    const sellProduct = (selling) => {
        stock -= selling;
    };

    const getStock = () => {
        return stock;
    };

    return { addStock, sellProduct, getStock };
};

let added = createStock();

let product = added;

product.addStock(7);

console.log("Stock:", product.getStock());

product.sellProduct(4);

console.log("Stock:", product.getStock());
